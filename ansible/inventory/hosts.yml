---
# CVE-2026-114938 (Java4Shell) — inventory de ejemplo
# Reemplazar ansible_host, ansible_user y claves/contraseñas reales.
# Layout: 3 clusters × 4 nodos = 12 hosts

all:
  vars:
    ansible_user: CHANGE_ME_USER
    # ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # ansible_password: CHANGE_ME_PASSWORD
    # ansible_become_password: CHANGE_ME_BECOME
    ansible_python_interpreter: auto_silent

  children:
    # ------------------------------------------------------------------
    # Cluster 1 — ejemplo: producción IdP / middleware
    # ------------------------------------------------------------------
    cluster1:
      vars:
        cluster_name: cluster1
        cluster_role: production
      hosts:
        c1-node1:
          ansible_host: 10.10.1.11
          node_role: app
        c1-node2:
          ansible_host: 10.10.1.12
          node_role: app
        c1-node3:
          ansible_host: 10.10.1.13
          node_role: app
        c1-node4:
          ansible_host: 10.10.1.14
          node_role: app

    # ------------------------------------------------------------------
    # Cluster 2 — ejemplo: 3scale / API
    # ------------------------------------------------------------------
    cluster2:
      vars:
        cluster_name: cluster2
        cluster_role: api
      hosts:
        c2-node1:
          ansible_host: 10.10.2.11
          node_role: app
        c2-node2:
          ansible_host: 10.10.2.12
          node_role: app
        c2-node3:
          ansible_host: 10.10.2.13
          node_role: app
        c2-node4:
          ansible_host: 10.10.2.14
          node_role: app

    # ------------------------------------------------------------------
    # Cluster 3 — ejemplo: lab / preprod (Podman EAP + RH-SSO)
    # ------------------------------------------------------------------
    cluster3:
      vars:
        cluster_name: cluster3
        cluster_role: lab
      hosts:
        c3-node1:
          ansible_host: 10.10.3.11
          node_role: lab
        c3-node2:
          ansible_host: 10.10.3.12
          node_role: lab
        c3-node3:
          ansible_host: 10.10.3.13
          node_role: lab
        c3-node4:
          ansible_host: 10.10.3.14
          node_role: lab

    # Grupo lógico para el lab Podman (ajustar hosts reales)
    lab_podman:
      hosts:
        c3-node1:
        # localhost:  # descomentar para probar en la máquina local
        #   ansible_connection: local
        #   ansible_host: 127.0.0.1
