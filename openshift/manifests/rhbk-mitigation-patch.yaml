# RHBK / Keycloak Operator — Java4Shell mitigation patches
# Adjust names/namespaces to match your install.
# Apply carefully (strategic merge / patch), e.g.:
#   oc patch keycloak.k8s.keycloak.org keycloak-rhhi -n rhbk --type=merge --patch-file=...
#   oc patch subscription keycloak-operator -n rhbk --type=merge --patch-file=...
---
# Operand (Keycloak server) — JAVA_OPTS_APPEND
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak-rhhi
  namespace: rhbk
spec:
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            env:
              - name: JAVA_OPTS_APPEND
                value: "-XX:-UseBASE64Intrinsics"
---
# Operator JVM — persist via OLM Subscription (survives CSV reconcile)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: keycloak-operator
  namespace: rhbk
spec:
  config:
    env:
      - name: JDK_JAVA_OPTIONS
        value: "-XX:-UseBASE64Intrinsics"
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:-UseBASE64Intrinsics"
